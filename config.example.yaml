# ============================================================================
# proxy-cache 配置示例
# 复制为 config.yaml 后按需修改；启动: ./proxy-cache -c config.yaml
# 所有时长支持: 30s / 30m / 1h30m（Go duration）、纯数字（按秒）、2d（天）、1w（周）
# ============================================================================

# HTTP 服务监听地址
listen: "0.0.0.0:8080"

# 日志级别：debug / info / warn / error（大小写不敏感；留空默认 info；非法值启动时直接报错）
# 四级从多到少：debug > info > warn > error，高级别包含低级别的全部日志
#   info  - 每次决策结果全留痕：规则匹配结果（含入站 Host）、GET 绕过缓存（BYPASS）原因、
#           url-redirect 轮询展开（本轮起始下标 + 各候选模板与占位符替换后最终 URL）、
#           候选命中并最终返回 / 候选失败、全败回退直连、缓存命中（含文件路径）、
#           写入缓存成功（含规则名/缓存 key/落盘文件路径/body 大小/ttl）、
#           成功返回内容（200 且 body 非空：来源/状态码/字节数/缓存状态）、
#           内容未变更（304，客户端缓存副本有效）、每条访问完成日志
#   debug - 在 info 基础上再增加：代理请求开始、逐条域名规则匹配过程（matched/excluded 明细）、
#           每次候选尝试开始、缓存查询 MISS 明细等细节
#   warn  - 在 info 基础上再增加：候选请求失败/未过判据/回退直连、写缓存失败、ACL 拦截等警告（含 error）
#   error - 仅输出错误：回源彻底失败（502）等
log:
  level: info
  # level: debug
  # progress-interval: 流式透传进度日志的输出间隔（默认 10s；<=0 关闭）：GET 路径目标
  # 流式回源（docker pull 大 blob）期间每隔该间隔输出一条「流式透传进度」日志
  # （已传字节数/上游声明大小与百分比/区间速率/自 commit 起耗时/客户端是否仍在接收）；
  # 上游停滞无新数据期间自然不输出，整条流在该间隔内完成则一条都不出（最终日志已有）
  # progress-interval: 10s
  # progress-summary-enabled: 活跃下载周期进度汇总开关（默认 true 开启；显式 false 关闭）：
  # 开启时每 progress-summary-interval 输出一轮全局汇总——先一条「活跃下载进度汇总」
  # （active 活跃数 + started 本轮新登记数 + client/ridealong/resume/prefetch 各自数量），
  # 再每个活跃下载一条「活跃下载进度」（source/image/digest/method/bytes/total/percent/
  # speed/elapsed）；docker 场景下客户端下载（client/ridealong/resume，含缓存命中回放）
  # 与异步预取下载（prefetch）按 source 区分；本轮没有任何下载登记（没有被访问）时静默，
  # 窗口内已结束的短下载仍会体现在 started 里，不会整轮看不到
  # progress-summary-enabled: true
  # progress-summary-interval: 活跃下载周期进度汇总的输出间隔（默认 3m；<=0 关闭周期汇总）：
  # 与上方 progress-interval（单条流的 10s 节拍）分工不同，本项是全局活跃下载视图，
  # 取 3 分钟避免汇总日志淹没单流进度
  # progress-summary-interval: 3m

# ----------------------------------------------------------------------------
# 回源超时（三个相互独立；全局与 domain-rules 规则级都可配，规则覆盖全局，
# 同一字段规则没配就用全局，全局也没有 = 该项不限制；
# url-redirect 候选对象还可用 connect-timeout / http-timeout / read-timeout /
# probe-timeout 按候选覆盖（三级优先级：候选 > 规则 > 全局），见下方 url-redirect 说明）
# ----------------------------------------------------------------------------
# http-timeout    单次上游尝试的总超时：覆盖「建连 + 响应头 + 完整读 body +
#                 401 后 token dance 及其带 token 重试」整个尝试，按每次尝试
#                 独立计时（候选重试/整轮重试时每次重新计时）；未配置 = 不限制
# read-timeout    无新增数据超时（idle）：以本次尝试累计收到的字节数为进度标志
#                 （响应头到达也算一次进度），窗口内有进度就重置计时器，窗口内
#                 无任何新数据才触发超时并取消该次尝试——慢速但持续传输的大文件
#                 不会被误砍；未配置 = 不限制
# connect-timeout 建连超时（TCP 拨号 + TLS 握手共用）；未配置 = 不限制
# 旧字段 timeout 语义已变更（有意的行为变更）：
#   - 旧版是「回源总超时，未配置兜底 60s」；现仅为 read-timeout 的退化别名，
#     且不再有 60s 默认值兜底（未配置 = 不限制）
#   - read-timeout 生效优先级：rule.read-timeout > rule.timeout >
#     global.read-timeout > global.timeout > 0（不限制）
#http-timeout: 300s
#read-timeout: 60s
#connect-timeout: 10s
#timeout: 60s              # 旧字段：仅当 read-timeout 未配置时才作为 read-timeout 生效

# 全局上游代理（http/https/socks5 地址），所有回源请求都会走它；留空表示直连
# 三级覆盖（高→低）：url-redirect 候选对象 http-proxy（显式空串 = 该候选强制直连）>
# 域名规则 http-proxy > 本全局值（候选级见下方 url-redirect 说明）
http-proxy: ""
# http-proxy: "http://127.0.0.1:7890"

# url-redirect 候选的成功判据：
#   status  - HTTP 200 即算成功（HEAD 响应天然无 body，content 判据对 HEAD 也自动按 status 语义）
#   content - HTTP 200 且 body 非空才算成功（默认，防止镜像返回空内容/软 404）
# HTTP 304（内容未变更）在两种模式下均视为成功候选：条件请求头（If-None-Match 等 5 个）
# 不透传给上游，回源始终为无条件 GET/HEAD；若上游对无条件请求仍回 304，304 原样透传给客户端
# （不写缓存，客户端用本地缓存副本），日志按成功留痕而非失败
# 带 Range 头的请求：上游回 206 视为成功并流式透传、不写缓存（docker 断点续传依赖它；
# 旧版 206 会被判据拒掉导致 Range 拉取全挂）
success-check: content

# 所有 url-redirect 候选都失败后，是否回退直接请求原始 URL
# 注意：路径目标请求（见下方 Docker Registry 场景示例）没有完整原始 URL 可直连，
# fallback-direct 不适用——候选全败直接报错（错误信息注明路径目标无直连回退）
fallback-direct: true

# ----------------------------------------------------------------------------
# 忽略 TLS 证书校验（insecure-skip-verify）：三级优先级从高到低
#   1. url-redirect 候选对象内 insecure-skip-verify（见下方 url-redirect 对象写法）
#   2. domain-rules 规则级 insecure-skip-verify（见 domain-rules 可选覆盖项）
#   3. 全局 insecure-skip-verify（本项）
# 候选最终生效值 = 候选显式值 ?? 规则显式值 ?? 全局值
# ----------------------------------------------------------------------------
# 典型场景：镜像站证书链不全（候选探测报 tls: failed to verify certificate:
# x509: certificate signed by unknown authority，每轮候选重试全部烧在证书错误上）、
# 内网自签证书的上游
# 安全代价：开启后该路径上的所有上游连接都跳过证书校验（连接仍加密，但无法确认
# 对端身份）——包括 30x 重定向目标（如 1ms.run -> cloudfront）、token dance 的
# 取 token 与带 token 重试、fallback 直连。等于关闭该路径的服务端身份验证与
# 防中间人/窃听保护，仅建议按需开启；推荐对个别镜像站用「候选级」精确开启，
# 而非打开规则级/全局开关
#insecure-skip-verify: false

# ----------------------------------------------------------------------------
# url-redirect 候选失败重试（全局与 domain-rules 规则级都可配，规则覆盖全局；
# 未配置 = 0，即不重试，行为与旧版一致）
# ----------------------------------------------------------------------------
# url-redirect-item-error-retry  单个候选的重试次数：某候选一次尝试失败
#                                （网络错误/超时/未过 success-check）后原地立即
#                                重试 N 次（总尝试 = 1+N，无退避），全部失败才
#                                轮到下一候选。注意：硬失败（上游 403 / token
#                                dance 后仍 401 / 探测预算耗尽，见
#                                url-redirect-probe-timeout）会跳过原地重试
#                                直接切下一候选——这类失败重试无意义却各烧数秒
# url-redirect-all-error-retry   整轮全错后的重试轮数：一轮 = 所有候选（含各自
#                                item 重试）都失败；全轮失败后整体重来最多 N 轮
#                                （总轮数 = 1+N），同一请求内的重试轮沿用同一候选顺序
# 每次尝试/重试的日志均含：候选 URL、第几次尝试/共几次、第几轮/共几轮、失败原因
#url-redirect-item-error-retry: 1
#url-redirect-all-error-retry: 1

# ----------------------------------------------------------------------------
# url-redirect 候选探测提速（全局与 domain-rules 规则级都可配，规则覆盖全局）
# 背景：docker 客户端等响应头约 30s 就超时断开（net/http: timeout awaiting response
# headers），「选定候选」的总耗时必须压在 30s 内（越快越好）
# ----------------------------------------------------------------------------
# url-redirect-probe-timeout  单次候选尝试的探测预算（默认 5s，0=不限制）：
#                             从发出请求到「**最终响应头到达**（含 401 token dance 的
#                             第二次响应）」的时限，覆盖建连后的等待与 token dance
#                             全程；到期取消该次尝试并硬失败快切下一候选。
#                             口径很关键：**响应头到手即算探测成功**，不把「首块 body
#                             到达」算进预算——现场日志里 1ms.run 已在 5s 内回 206
#                             （dance 花 2.9s），却因为还在等首块被判 probe-timeout
#                             硬失败丢弃；停表之后只等首块，由 read-timeout（无新增
#                             数据）与 http-timeout（整次尝试）兜底。
#                             docker blob 目标（/v2/<name>/blobs/<digest>）在候选级/
#                             规则级/全局都未显式配置时改用更大的缺省 30s（302MB 级
#                             layer 的上游响应头经常 5s 内到不了，5s 预算会把候选全判
#                             硬失败直接 502）；manifest 等其它目标仍用 5s 快速失败。
#                             命中候选仍立即 commit：commit 时刻 = 首个通过判据的候选
#                             （hedge 竞速），与预算大小无关；预算只是「放弃阈值」。
#                             内置候选扫描总预算同步按目标类型放宽：manifest 等仍是
#                             20s，docker blob 目标 60s 起（max(60s, (候选数-1)×
#                             hedge-delay + 最大探测预算 + 20s)）——否则 20s 总预算会
#                             在 30s 探测预算用完之前先把整轮扫描掐死，等于白加。
#                             与既有三个超时的边界：
#                               - http-timeout  管整次尝试总时长（含完整读 body），
#                                 探测通过后 body 读取仍受它约束；
#                               - read-timeout  管「无新增数据」idle（全程生效）；
#                               - connect-timeout 管建连（TCP 拨号 + TLS 握手）；
#                               - probe-timeout 只管探测阶段：探测通过即解除，
#                                 后续读 body 不受它约束
#url-redirect-probe-timeout: 5s
# url-redirect-hedge-delay    候选阶梯并发竞速（hedge）的放行间隔（默认 2s，0=纯
#                             串行禁用竞速）：候选按 round-robin 顺序起步，首个
#                             候选立即发出，之后每隔该间隔放行下一个候选并发探测
#                            （前一个不取消）；某候选先失败时立即放行下一候选
#                            （不等间隔）；第一个通过成功判据的候选胜出，其余全部
#                             取消（context 取消，连接及时释放）。
#                             最坏「选定候选」耗时 ≈ (候选数-1)×hedge-delay +
#                             胜者的探测耗时（如 5 候选 ≈ 4×2s + 1s ≈ 9s）；
#                             全部候选都失败的极坏情况由内置扫描总预算兜底（manifest
#                             等 20s、docker blob 60s 起，见上方 probe-timeout 段）：
#                             到期提前终止并 502，docker 客户端会自行重试该层
#url-redirect-hedge-delay: 2s

# ----------------------------------------------------------------------------
# 慢速升级多源并发续传（slow-download escalation，全局与 domain-rules 规则级都可配，
# 规则覆盖全局；仅 type=docker 规则的 GET 路径目标流式回源生效）
#
# ⚠ 坑（线上真实踩过）：规则里**没写 `type: docker`**（留空 = 不过滤请求类型）时，
# 下面四个 slow-download-* 参数与规则级同名参数**静默不生效**——请求照样命中规则、
# 缓存与候选照常工作，只是「慢速升级多源并发续传」不启用，日志里也不会有任何报错。
# 想用它，务必在该 domain-rule 上显式写 `type: docker`（见文末 Docker 场景示例）。
# ----------------------------------------------------------------------------
# docker pull 大 blob 时若选中的镜像站下载过慢，自动向其余全部候选并发发起
# Range 续传（每个源拉满剩余区间自己的流），与胜者既有连接按偏移有序合并写给
# docker；落后领先源超过 slow-download-max-behind 的源被剪枝关闭（带宽放大靠
# 剪枝收敛；内存上界 = 源数×4MB）；非 docker 类型规则 / HEAD / 直连路径完全不生效。
# slow-download-speed            判慢阈值（B/s，窗口平均送出速率低于它判「过慢」）。
#                                默认 1MB；<=0 = 关闭整个特性。字节数写法支持纯整数
#                                或 "512KB"/"1MB"/"1.5MB"/"64MB"/"2GB"（1024 进制，
#                                单位大小写不敏感，支持 B/KB/MB/GB/TB 与小数）
# slow-download-window           判速滑动窗口时长（默认 10s，启用时最小 1s）：窗口满
#                                按窗口平均速率判慢；不满足条件零开销（除窗口计时）
# slow-download-min-remaining    触发所需最小剩余字节数（默认 64MB）：剩余量不足
#                                不升级（尾巴太小没必要并发拉满）；0 = 不设门槛；
#                                上游总长不可知（无 Content-Length/Content-Range）
#                                则永不触发
# slow-download-max-behind       多源合并的剪枝阈值（默认 8MB，启用时必须 >0）：
#                                某源落后领先源超过该字节数即被关闭移除
# 触发日志「下载过慢，升级多源并发续传」（含 rule/candidate/bytes/content_length/
# window/window_speed/sources）；每流至多触发一次；升级后进度日志追加 sources 字段。
#slow-download-speed: 1MB
#slow-download-window: 10s
#slow-download-min-remaining: 64MB
#slow-download-max-behind: 8MB

# ----------------------------------------------------------------------------
# docker 镜像 layer 异步预取（manifest 驱动，全局配置，无规则级覆盖）
# ----------------------------------------------------------------------------
# 识别出「GET /v2/<name>/manifests/<ref> 路径目标回源成功（HTTP 200 已写入缓存）且
# 响应为单平台 image manifest（docker schema2 / OCI image manifest，容忍 ;charset=...
# 参数后缀）」后，异步预取该镜像其余 layer blob 写入缓存：docker daemon 默认
# max-concurrent-downloads=3 逐层下载慢，预取后客户端后续 blob 请求直接命中（X-Cache: HIT）。
# HEAD / 206(Range) 断点续传 / 多平台 manifest list 与 OCI index（客户端拿到 index 后会
# 立刻再请求具体平台的 child manifest，届时自然触发）/ 关闭缓存（BYPASS）均不触发。
# 预取复用与客户端完全相同的回源路径（候选轮询、超时覆盖、http-proxy、insecure TLS、
# 401 token dance、缓存写入），只写缓存不产生客户端响应；同一 blob 预取有在途集合去重
#（防重复排队），与客户端并发请求同一 blob 时经 singleflight 合并（在途则不另起第二路
# 下载）；失败只记日志不重试、绝不影响客户端。blob 按 digest 寻址内容不可变，不存在
# 刷新问题（过期由 cache.ttl / clean-interval 管）；预取不改变 manifest 本身的
# TTL/ETag/缓存行为，tag(:latest) 更新后新 manifest 引用相同 digest 的 layer 直接命中。
# 在途层搭车：还在预取下载中的层被客户端请求时直接搭上预取那一路——响应头照抄预取
# 快照（X-Cache: PREFETCH），body = 已落盘磁盘前缀 + 实时增量拼接回放，上游对该 blob
# 只有预取一路下载、已下载部分直接复用（客户端不从 0 重新下载）。仅无 Range 的完整
# GET 搭车（HEAD / 206 续传 / no-cache 走原路径；搭车被断后 docker 以 Range 断点续传
# 重试，206 透传不写缓存兜底「不从 0 下载」）；搭车不叠加慢速升级多源续传（上游速率
# 由预取一路决定，过慢靠 30s 订阅超时降级 + 客户端 Range 重试兜底）；随本开关一同
# 生效（关闭预取即无搭车），无新增配置项。
# docker-prefetch-enabled       预取开关（默认 true 开启；显式 false 关闭）
# docker-prefetch-concurrency   预取并发数上限（默认 4；必须为正整数，
#                               显式 <=0 启动报错——关闭预取用上方开关）
#docker-prefetch-enabled: true
#docker-prefetch-concurrency: 4

# blob 半截保留与无感续传：blob（/v2/<name>/blobs/<digest>）流式下载（客户端主路径与
# 预取路径）中断/失败时，把已下载前缀保留为缓存目录内的半截文件（.part-<缓存key>，
# 文件大小即已下载字节数，内容为 blob 原文前缀）——重 pull 时 docker 客户端是无 Range
# 的完整 GET（从 0 开始），proxy 撞上「缓存 MISS + 半截文件」时按候选轮询从断点发
# Range: bytes=<已存字节>- 续传（blob 按 digest 寻址内容不可变，任意候选同 digest 内容
# 一致），对客户端回一次完整 200：body = 本地半截前缀回放 + 上游剩余实时拼接，docker
# 无需支持 Range、完全无感知（X-Cache: RESUME；并发请求经既有搭车机制共享同一路续传
# 流，上游只一路下载）。续传中途失败保留更新后的半截（进度不回退），docker 重试接着
# 更长前缀续传。manifest 会变仅 blob 启用；带 Range 的请求维持既有 206 透传；上游对
# Range 不回 206（不支持/200 全量回）时安全降级走既有全量回源、绝不给客户端错误数据。
# 半截在对应 blob 正式缓存条目落盘后立即删除；空半截与超过 24h 的孤儿残留由缓存后台
# 清理（Clean/Janitor）兜底。
# docker-partial-resume-enabled blob 半截保留与无感续传开关（默认 true 开启；显式 false 关闭）
#docker-partial-resume-enabled: true

# docker 半截续传宽限终止：续传执行方向客户端写响应体失败（docker 已断开）且在途条目
# 无搭车订阅者时按本宽限计时——到期仍无订阅者则终止上游读取、保留半截（进度不回退）、
# 移除在途条目，不再「继续读完只填缓存」长时间占用上游带宽（现场 261MB blob 断开后旧
# 语义又拉了 3m44s 才写完）；宽限期内有订阅者搭车则放弃终止继续拉，断开时已有订阅者
# 直接维持现状（不宽限）。语义分工：仅作用于客户端驱动的续传执行方（source=resume）；
# 客户端主路径是断开即停（立即终止）；异步预取（source=prefetch）无客户端概念，保持
# 「继续填缓存」语义不变，绝不受本项影响。全局配置，无规则级覆盖。
# docker-resume-client-gone-grace blob 半截续传「客户端断开宽限终止」宽限时长（默认 2s；显式 <=0 关闭宽限终止，完全恢复旧「继续读完填缓存」语义）
#docker-resume-client-gone-grace: 2s

# docker 可变目标多源并发回源与合并：docker 可变目标（tag manifest / referrers / tags
# list，不缓存每次回源）BYPASS 时并发请求全部 url-redirect 候选源（成功判据与顺序管线
# 相同，HTML 反爬页等未过判据的源拒之于合并之外），tags/list 合并各源 tags（并集去重、
# 字典序排序，慢源漏 tag 不再可能）、referrers/<digest> 合并 descriptors（按
# mediaType+digest 去重）、manifests/<tag> 按各成功源 Docker-Content-Digest 取多数共识
# （平票取最快成功者，HEAD 与 GET 同策略保证 docker pull 流程内 HEAD/GET 判定一致）。
# manifest 摘要共识后无需再做源 pin：blob 按 digest 寻址、内容不可变，共识摘要确定后
# 任意源的同 digest 内容一致。边界：tags/list 带分页参数（?n= / ?last=）不做合并（跨源
# 页码语义不一致，退回顺序管线）；候选数 <2 不启用；其余 BYPASS（request-range /
# request-no-cache / cache-disabled 等）维持既有顺序管线；全部源失败退回既有顺序管线
# （继承其 4xx 透传 / 502 语义）；并发上限 8、每候选超时复用现有候选级配置。
# docker-multi-source-enabled docker 可变目标多源并发回源开关（默认 true 开启；显式 false 关闭）
#docker-multi-source-enabled: true

# url-redirect：回源镜像/上游代理候选列表（对象数组，破坏性变更：不再支持旧版纯字符串写法，
# 解析期报错并给出迁移示例；候选对象支持字段见下方示例与 README「url-redirect 候选对象」小节）
# 候选对象字段：
#   template               必填非空，即旧版的模板字符串，占位符语义不变
#   insecure-skip-verify   可选（bool），候选级「忽略 TLS 证书校验」，仅对该候选生效
#                          （优先级高于规则级/全局；省略 = 继承规则级，再继承全局）
# 模板占位符（每个变量均支持 $name 与 ${name} 两种写法，每个模板至少包含一个，启动时校验）：
#   $1 / ${1} —— 目标串（兼容保留）：
#       完整 URL 请求 = 目标 URL 原文，如
#         https://hk.gh-proxy.org/$1 + https://raw.githubusercontent.com/a/b
#         => https://hk.gh-proxy.org/https://raw.githubusercontent.com/a/b
#       路径目标请求（如 docker registry 的 /v2/xxx/manifests/latest）= 路径目标本身（不带 scheme）
#   $http.server.header.full_url / ${http.server.header.full_url} —— 本次入站请求的完整 URL：
#       scheme://host/path?query（scheme 优先取请求头 X-Forwarded-Proto 首个值，否则按 TLS 判定；
#       host 为入站 Host 原样含端口）
#   $http.server.header.full_url_no_server / ${http.server.header.full_url_no_server}
#       —— 入站请求 URL 去掉 scheme://host 的部分（/path?query，以 / 开头含查询串），如
#         入站 http://registry-proxy-cache.xxx:5480/v2/a/b/manifests/latest 时
#         https://docker.1panel.live/$http.server.header.full_url_no_server
#         => https://docker.1panel.live/v2/a/b/manifests/latest
# 展开按变量名长度降序替换（full_url_no_server 先于 full_url，避免前缀遮蔽），未知的 $ 序列
# 原样保留为字面量；斜杠接缝去重：full_url_no_server 的值以 / 开头，模板里占位符前紧邻 /
# 时（如 https://docker.1panel.live/$http...）两个 / 合并为一个，保证拼出的是
# https://docker.1panel.live/v2/... 而非 ...//v2/...；
# 按 round-robin 轮换起始下标逐个尝试（第 1 个请求从第 1 条开始，第 2 个请求从第 2 条开始……），
# 默认按阶梯竞速（hedge）探测：首个候选立即发出，之后每隔 url-redirect-hedge-delay 放行下一个
# 并发探测，第一个通过 success-check 的候选胜出（其余取消）；
# 只要有一个候选通过 success-check 即返回（200 才写缓存；304 视为成功并原样透传、不写缓存；
# 带 Range 的请求 206 视为成功并流式透传、不写缓存）；
# 候选失败的重试（单候选原地重试 / 整轮全败重试）见 url-redirect-item-error-retry 与
# url-redirect-all-error-retry；候选全部失败时按 fallback-direct 处理（路径目标请求无直连回退）
url-redirect:
  - template: https://hk.gh-proxy.org/$1
  - template: https://gh-proxy.com/$1
  - template: https://mirror.ghproxy.com/$1
  # 仅某个候选证书不受信时精确开启（省略则继承规则级/全局配置）：
  # - template: https://docker.actima.top/$http.server.header.full_url_no_server
  #   insecure-skip-verify: true
  # 候选级 http-proxy 与超时覆盖（三级优先级：候选 > 规则 > 全局；仅该候选生效）：
  # 慢代理场景示例——某个候选必须走代理时单独指定，并按代理质量放宽该候选超时，
  # 其余候选不受影响；候选 http-proxy 显式写 ""（空串）= 该候选强制直连（覆盖上层代理）
  # - template: https://slow.via-proxy.example/$1
  #   http-proxy: socks5://127.0.0.1:1080   # 该候选走 socks5/http/https 代理
  #   connect-timeout: 30s                  # 该候选建连放宽（0 = 不限制；负数非法）
  #   http-timeout: 20m                     # 该候选单次尝试总超时放宽
  #   read-timeout: 120s                    # 该候选无新增数据超时
  #   probe-timeout: 20s                    # 该候选探测预算（规则/全局
  #                                         #   url-redirect-probe-timeout 的候选级短名）
  # 原始 URL 独立候选：template 恰为 $1（或 ${1}）= 原始目标 URL 原文也参与候选轮询，
  # 配合候选级 http-proxy 可走代理回源（仅完整 URL 目标规则适用，路径目标/docker 规则下
  # $1 不带 scheme 该候选运行期会失败；不想候选全败后再兜底直连可配 fallback-direct: false）
  # - template: $1
  #   http-proxy: http://127.0.0.1:7890
  # 候选级上游凭据 auth（可选）：该候选 401 token dance 用 Basic 账号密码换 Bearer token
  #（替代匿名 dance）。典型场景：带鉴权的镜像站（如 HLmirror——mirror.houlang.cloud，
  # 匿名 token 只有匿名权限，私有仓库 / 登录账号才能拉取）；支持二级路径镜像
  #（如 template: https://mirror.houlang.cloud/dh/$http.server.header.full_url_no_server
  #  即 Docker Hub 的 /dh/ 前缀，ghcr 用 /ghcr/，以此类推）。username 必填，password 可留空；
  #  两级优先级：候选 auth > 规则级 auth（见下方 domain-rules 的 auth），无全局级
  # - template: https://mirror.houlang.cloud/dh/$http.server.header.full_url_no_server
  #   auth:
  #     username: demo@gmail.com
  #     password: "访问令牌（令牌当密码用）"
  #   # 不明文写法：password 用 ${环境变量} 引用，令牌经容器环境变量注入不落配置文件
  #   #（仅 ${VAR} 显式形态展开；纯文本即使含 $ 也原样保留）：
  #   # auth:
  #   #   username: demo@gmail.com
  #   #   password: "${HL_HOULANG_TOKEN}"   # 启动容器时 -e HL_HOULANG_TOKEN=真实令牌

# 缓存配置
# 注意：整块注释掉 cache: 并不等于关闭缓存！未配置时启用内置默认值
#   （enabled: true / path: ./cache-data / ttl: 30m / clean-interval: 10m，
#    启动日志 cache_enabled 可见实际生效值）。要关闭全局缓存必须显式写：
#   cache:
#     enabled: false
cache:
  enabled: true              # 是否启用缓存（全局关闭后仍可在 domain-rules 内按规则开启，见下方场景示例）
  path: ./cache-data         # 缓存目录（默认 ./cache-data；命名避免与源码 cache/ 包目录混用）
  ttl: 30m                   # 默认缓存时长（域名规则可覆盖）；0=永不过期（未配置默认 30m；负数非法）
  clean-interval: 10m    # 后台过期清理扫描间隔（<=0 关闭；读取命中过期条目时也会惰性删除）

# 域名/URL 规则（自上而下，第一条命中的规则生效）
# match 与 exclude 均对「http://<入站Host>/<目标>」整串做非锚定匹配（Host 归一化为小写）：
#   - 按目标 URL 匹配（旧写法兼容，非锚定）：如 raw\.githubusercontent\.com
#   - 按入站域名匹配：如 'http://github\.path\..+'（入站 Host 形如 github.path.xxx 时命中）
#   - 路径目标请求（路径不是完整 URL，如 docker registry 的 /v2/xxx/manifests/latest）
#     同样按该整串匹配（target 段即路径目标），必须命中规则且规则配了 url-redirect 才能回源，
#     见下方「Docker Registry 镜像加速」场景示例
# type（可选）请求类型过滤：限定本规则只承接哪类请求，发生在 match/exclude 匹配之前
#（类型不符的规则直接跳过，继续向下尝试后续规则）。取值：
#   - 留空/未配置（默认）= 不过滤请求类型，任何请求都可命中本规则（完全兼容旧配置）
#   - type: docker  仅路径目标请求可命中本规则（如 docker registry 的 /v2/xxx/manifests/latest）
#   - type: web     仅完整 URL 请求可命中本规则（如 /https://raw.githubusercontent.com/...）
#   - 其他值启动时直接报错（快速失败）；配置自动做 trim + 小写归一化（"Docker " 视为 "docker"）
# 典型用途：同一入站域名/同一段 match 下，把 docker 流量与 web 流量分流到两条不同规则
#（各自的 cache / 超时 / url-redirect 候选互不影响）
# 注意 1：缓存 key 与 allow-list / deny-list：完整 URL 请求仍只对目标 URL 匹配；
#         路径目标请求对「http://<入站Host>/<路径目标>」整串做 ACL 匹配，
#         缓存 key 输入也为该整串（入站 Host 参与，不同入站域名互不污染）
# 注意 2：match 里写了入站 Host 段（如 http://github\.path\..+）时，必须让请求的
#         Host 以该段开头（如用 github.path.你的域名 解析到本服务再访问）；
#         直接用 IP:端口 或不相关域名访问不会命中本规则，会落全局默认配置
#         （日志「规则匹配结果 rule=global-default」可确认），此时既没有规则的
#         url-redirect 轮询，也不会写规则独立缓存目录；路径目标请求更会直接 400
# exclude（可选）为排除正则列表，同样对整串非锚定匹配：
#   match 命中后再逐个检查 exclude，任一命中即排除本规则（视为不匹配），
#   继续向下尝试后续规则（都不命中则走全局默认配置）
domain-rules:
  - name: githubusercontent
    match: '.*https://[^.]+\.githubusercontent\.com'
    # 排除列表（可选，支持多个、支持正则）：下面示例让 dongchengjie/airport 仓库
    # 不套用本规则的 6h 缓存，落到下一条规则（github-release / github-archive）
    # 或全局默认配置（ttl: 30m）
    exclude:
      - 'dongchengjie/airport'
      # - 'someuser/somerepo'   # 支持配置多个，任一命中即排除
      # - '/branches/'          # 支持任意正则
    cache:
      enabled: true
      ttl: 6h                # raw 文件内容较稳定，缓存更久（0=永不过期；不写沿用全局 cache.ttl）
      # path: ./cache-raw            # 规则独立缓存目录（不写沿用全局 cache.path；写独立目录即按规则分目录缓存）
      # clean-interval: 30m          # 该目录的后台清理间隔（不写沿用全局 cache.clean-interval；<=0 关闭）
    # ---- 以下均为可选覆盖项，不写则沿用全局配置 ----
    # http-proxy: "http://127.0.0.1:7890"   # 该规则的回源走指定代理
    # success-check: status                  # 该规则 200 即算成功
    # fallback-direct: false                 # 候选全败时不回退直连
    # insecure-skip-verify: false            # 该规则忽略 TLS 证书校验（覆盖全局；url-redirect
    #                                        # 候选对象内的显式值优先级更高；安全代价见顶部全局说明）
    # ---- 超时覆盖（规则没配的字段沿用全局；含义见顶部全局说明） ----
    # http-timeout: 120s                     # 该规则单次上游尝试的总超时
    # read-timeout: 60s                      # 该规则无新增数据超时（idle）
    # connect-timeout: 10s                   # 该规则建连超时（TCP 拨号 + TLS 握手）
    # timeout: 120s                          # 旧字段：仅当该规则未配 read-timeout 时作为 read-timeout 生效
    # ---- url-redirect 重试覆盖（规则没配沿用全局；未配置 = 0 不重试） ----
    # url-redirect-item-error-retry: 1       # 该规则单个候选失败后的原地重试次数
    # url-redirect-all-error-retry: 1        # 该规则整轮全败后的重试轮数
    # ---- url-redirect 候选探测提速覆盖（规则没配沿用全局；含义见顶部全局说明） ----
    # url-redirect-probe-timeout: 5s         # 该规则单次候选尝试的探测预算（0=不限制）
    # url-redirect-hedge-delay: 2s           # 该规则候选阶梯竞速的放行间隔（0=纯串行）
    # ---- 规则级上游凭据（可选；仅该规则的所有候选默认使用，候选对象显式 auth 优先） ----
    # auth:                                  # 401 token dance 用 Basic 账号密码换 Bearer token
    #   username: demo@gmail.com             #   （带鉴权镜像站如 HLmirror；username 必填，
    #   password: "访问令牌"                 #    password 可留空；无全局级，避免误泄露）
    # ---- 慢速升级多源并发续传覆盖（仅 type=docker 规则生效；规则没配沿用全局，含义见顶部全局说明） ----
    # slow-download-speed: 1MB               # 该规则判慢阈值（B/s；<=0 关闭特性）
    # slow-download-window: 10s              # 该规则判速滑动窗口（启用时最小 1s）
    # slow-download-min-remaining: 64MB      # 该规则触发所需最小剩余字节数（0 = 不设门槛）
    # slow-download-max-behind: 8MB          # 该规则多源合并的剪枝阈值（启用时必须 >0）
    # url-redirect:                          # 该规则专用候选列表（设为 [] 表示该规则直连回源）
    #   - template: https://gh-proxy.com/$1
    #   - template: $1                        # 原始 URL 也参与候选（$1 = 原始目标 URL，配合候选级 http-proxy 可走代理回源）
    #     http-proxy: http://127.0.0.1:7890

  - name: github-release
    match: 'github\.com/[^/]+/[^/]+/releases/download/'
    cache:
      ttl: 1h                # release 附件缓存 1 小时

  - name: github-archive
    match: 'github\.com/[^/]+/[^/]+/(archive|releases)/'
    cache:
      enabled: false         # zip/tar 大文件不走缓存

  # ---- 场景示例：全局关缓存，仅命中规则的流量开启独立缓存 ----
  # 把上面全局 cache.enabled 改为 false 后，取消本块注释即可：
  # 未命中任何规则的流量不缓存（BYPASS），命中本规则的流量才缓存，且写入规则自己的
  # 独立目录 ./cache-raw（与全局 cache.path 互不影响，各自独立清理）
  # - name: raw-only
  #   match: '.*https://[^.]+\.githubusercontent\.com'
  #   cache:
  #     enabled: true          # 规则内显式开启（优先于全局开关）
  #     path: ./cache-raw      # 规则独立缓存目录（不写则沿用全局 cache.path）
  #     ttl: 6h                # 0=永不过期；不写沿用全局 cache.ttl
  #     clean-interval: 30m    # 该目录的后台清理间隔（不写则沿用全局 cache.clean-interval）

  # ---- 场景示例：Docker Registry 镜像加速（docker pull 走本服务拉取镜像） ----
  # docker daemon 把本服务当 registry 访问，请求路径不是完整 URL（路径目标），如：
  #   GET/HEAD http://registry-proxy-cache.linkease.net:5480/v2/adockero/proxy-cache/manifests/latest
  # 路径目标请求的限制：仅支持 GET/HEAD（其他方法 400）；必须命中本条规则且 url-redirect 非空
  # 才能回源（未命中规则直接 400，全局默认配置不承接路径目标）；候选全败无直连回退（直接报错）；
  # 缓存 key 输入为「http://<入站Host>/<路径目标>」（入站 Host 参与，不同入站域名互不污染）。
  # 缓存 MISS 的回源为流式透传：候选竞速选定后立即向 docker 写响应头（commit），再边读
  # 上游边写给 docker——docker 客户端等响应头约 30s 就超时断开（net/http: timeout awaiting
  # response headers），流式透传把首字节时间压缩为「选定候选」的耗时，不再被大 blob 的
  # 完整下载拖超时；EOF 后按既有条件写缓存，docker 断开后重试该层即可缓存命中（HIT）。
  # 带 Range 的请求（docker/containerd 的 httpReadSeeker 无论从哪个偏移都带 Range）：
  #   - 起点 0（`bytes=0-`，首次拉某层）：**等价于完整 GET**——剥离 Range 后走缓存 HIT /
  #     半截无感续传 / 预取搭车，对客户端回 206 + Content-Range，链路中途断也能续传拉完；
  #   - 起点 >0（`bytes=<偏移>-`，断点续传重试，现场起点 ≈ 82.8MB）：**本地有完整内容就
  #     秒回**——缓存 HIT 直接从条目 body 切片回 206（不发上游）；只有半截前缀且起点不
  #     超过半截长度时，从半截的起点位置回放 + 上游剩余区间续传拼接（同样回 206，内部照常
  #     写完整缓存）；无半截或起点超出半截（中间缺一段、不能凭空补）才维持旧版 206 透传
  #     （缺口场景会打一条 Warn 说明缺口大小）；
  #   - 非 blob 目标 / 后缀区间 / 多区间：维持旧版 206 透传、不写缓存。
  # 镜像站对匿名 blob/manifest 常回 401 + WWW-Authenticate: Bearer 挑战：本代理会自动按挑战
  # 去 realm 匿名取 token 并带 Authorization: Bearer 重试一次（与 docker 客户端直连行为等价），
  # token 进程内缓存（TTL 取 expires_in，缺省 60s），不会每个 blob 层都打一次 auth 端点。
  # 用法（入站域名换成自己部署的、解析到本服务，端口对应 listen）：
  #   docker pull registry-proxy-cache.linkease.net:5480/adockero/proxy-cache
  # - name: docker-registry
  #   type: docker              # 仅路径目标请求命中本规则（web 流量不受本规则影响，可另配 type: web 规则分流）
  #                             # ⚠ 必须写：缺 type 时本规则与全局的 slow-download-* 四个参数静默不生效
  #   match: '.+registry-proxy-cache\.linkease\...+'   # 换成自己的入站域名（对整串非锚定匹配）
  #   cache:
  #     enabled: true
  #     ttl: 666h                # 镜像 manifest/layer 内容不可变，缓存 666 小时（0=永不过期）
  #     path: ./cache-docker     # 规则独立缓存目录，与其他场景隔离（记得挂载/保证可写）
  #     clean-interval: 30m      # 该目录的后台清理间隔（不写则沿用全局 cache.clean-interval）
  #   success-check: status      # registry /v2/ ping 等响应可能空 body，content 判据会误拒，用 status
  #   fallback-direct: false     # 路径目标无完整原始 URL 可直连回退，候选全败直接报错
  #   read-timeout: 120s         # 大镜像 blob 慢速但持续传输不被砍：120s 内无任何新增数据才判超时
  #   http-timeout: 600s         # 单次尝试总超时兜底（含 token dance 与读 body 全程）
  #   # 探测预算不配时按目标类型取缺省：docker blob 目标 30s（大 layer 上游响应头慢）、
  #   # manifest 等其它目标 5s；下面显式写 5s 表示「所有目标统一 5s」（0 = 不限制）
  #   url-redirect-probe-timeout: 5s     # 单候选探测预算：响应头 5s 未就绪即硬失败快切下一候选
  #   url-redirect-hedge-delay: 2s       # 候选阶梯竞速：每 2s 放行下一个候选并发探测，先过判据者胜出
  #   url-redirect-item-error-retry: 1   # 镜像站偶发抖动：候选失败后原地重试一次（硬失败跳过）
  #   url-redirect-all-error-retry: 1    # 整轮候选全败后再整体重试一轮
  #   # ---- 慢速升级多源并发续传（仅 type=docker 生效；含义见顶部全局说明） ----
  #   # 竞速胜出的镜像站拉 blob 太慢时（10s 窗口平均 < 1MB/s），其余镜像站并发 Range 续传
  #   # 合并提速；慢源超过 8MB 落后被剪枝。slow-download-speed: 0 可显式关闭整个特性。
  #   # ⚠ 本规则的 type 不是 docker（或没写）时，下面四个参数静默不生效（不报错、不打日志）
  #   slow-download-speed: 1MB           # 判慢阈值（B/s；<=0 关闭特性）
  #   slow-download-window: 10s          # 判速滑动窗口（启用时最小 1s）
  #   slow-download-min-remaining: 64MB  # 剩余量不足不升级（0 = 不设门槛）
  #   slow-download-max-behind: 8MB      # 合并中落后领先源超限即剪枝
  #   url-redirect:              # 多镜像站候选轮询（对象数组），均用 full_url_no_server 拼回源路径；
  #                              # 候选级 insecure-skip-verify 仅对该候选生效（三级优先级最高，
  #                              # 适合个别镜像站证书链不全的情况，如 actima）
  #     - template: https://docker.1panel.live/$http.server.header.full_url_no_server
  #     - template: https://hub.rat.dev/$http.server.header.full_url_no_server
  #     - template: https://docker.m.daocloud.io/$http.server.header.full_url_no_server
  #     - template: https://docker.1ms.run/$http.server.header.full_url_no_server
  #     - template: https://docker.actima.top/$http.server.header.full_url_no_server
  #       insecure-skip-verify: true   # 仅这个镜像站证书不受信，候选级精确开启
  #     # 内网 kspeeder（如 https://kspeeder.common-all:5443）：地址里的主机名不在它证书的
  #     # SAN 里（证书只对 *.linkease.net 有效）→ 必须给该候选显式 insecure-skip-verify: true，
  #     # 否则每次 TLS 握手都失败、还会按 url-redirect-item-error-retry 原地反复重试（纯噪音，
  #     # 该候选永远不可能胜出）。若该服务有证书匹配的域名，改成那个域名比关校验更安全：
  #     #   - template: https://kspeeder.linkease.net:5443/$http.server.header.full_url_no_server
  #     - template: https://kspeeder.common-all:5443/$http.server.header.full_url_no_server
  #       insecure-skip-verify: true   # 证书里的域名与地址不匹配（非证书链不全），必需
  #     # ⚠ docker 规则（路径目标）下绝不要写 `template: $1`：$1 是「不带 scheme 的路径串」
  #     #（如 v2/xxx/blobs/sha256:...），回源必然报 unsupported protocol scheme "" 失败，
  #     # 属永远失败的噪音候选。$1 只对完整 URL 目标（web 规则）有意义（见 README 说明）。
  #     # 想让 Docker Hub 官方 registry 也作为候选兜底，写完整模板并给该候选配代理：
  #     - template: https://registry-1.docker.io/$http.server.header.full_url_no_server
  #       http-proxy: socks5://127.0.0.1:1080
  #     # 候选级 http-proxy 与超时（三级优先级：候选 > 规则 > 全局；仅该候选生效）：
  #     # 慢代理候选单独走 socks5 并放宽超时（直连候选不显式配置探测预算时：manifest 用 5s
  #     # 快速失败、blob 用 30s 大文件缺省）；
  #     # 候选 http-proxy 显式写 ""（空串）= 该候选强制直连（覆盖规则/全局代理）
  #     - template: https://slow.via-proxy.example/$http.server.header.full_url_no_server
  #       http-proxy: socks5://127.0.0.1:1080
  #       connect-timeout: 30s
  #       http-timeout: 20m
  #       probe-timeout: 20s

# 允许/拒绝列表（正则，优先级高于缓存与回源）：完整 URL 请求对目标 URL 匹配；
# 路径目标请求对「http://<入站Host>/<路径目标>」整串匹配（保持拦截能力）
# deny-list 命中即拒绝（403）；allow-list 非空时为白名单模式（未命中即拒绝 403）
allow-list: []
#  - 'https://raw\.githubusercontent\.com/'
deny-list: []
#  - 'example\.com'
